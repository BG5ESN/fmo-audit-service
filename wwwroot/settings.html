<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配置 - EMQX 审计监控</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <span class="topbar-title">EMQX 审计监控</span>
  <nav class="topbar-nav">
    <a href="/">排行榜</a>
    <a href="/topics.html">主题统计</a>
    <a href="/health.html">健康</a>
    <a href="/settings.html" class="active">配置</a>
  </nav>
  <div class="topbar-right">
    <span id="collect-status"></span>
    <a id="logout">退出登录</a>
  </div>
</div>

<div class="chart-box" style="max-width:720px">
  <div class="config-section">
    <div class="config-section-title">EMQX 连接</div>
    <div class="config-section-body">
      <div class="form-row">
        <label>EMQX 地址（如 http://192.168.1.100:18083）</label>
        <input class="text-input" id="emqx-url" placeholder="http://服务器IP:18083">
      </div>
      <div class="form-row">
        <label>API Key</label>
        <input class="text-input" id="api-key" autocomplete="off">
      </div>
      <div class="form-row">
        <label>API Secret</label>
        <input class="text-input" id="api-secret" type="password" autocomplete="off">
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" id="save-config">保存并连接</button>
        <button class="btn" id="disconnect">断开监控</button>
        <span id="config-msg" class="form-msg" style="margin:0"></span>
      </div>
      <div class="form-msg" id="config-info" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="config-section">
    <div class="config-section-title">主题统计（规则引擎消息统计）</div>
    <div class="config-section-body">
      <div class="kv">状态：<b id="topic-status">未启用</b></div>
      <div class="kv">已接收消息：<b id="topic-total">0</b> <span style="color:#999">（最后接收 <span id="topic-last">-</span>）</span></div>
      <div class="kv" style="margin-top:4px">Webhook 地址：<b id="topic-webhook" class="mono"></b></div>
      <div class="form-row" style="margin-top:10px">
        <label>统计主题（规则引擎按 主题/# 匹配，含子主题）</label>
        <input class="text-input" id="topic-name" placeholder="FMO/RAW">
      </div>
      <div class="form-row">
        <label>Webhook 地址（EMQX 能访问到的本服务地址，默认自动生成）</label>
        <input class="text-input" id="topic-webhook-url" placeholder="http://服务器IP:9527/api/ingest">
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" id="topic-enable">启用主题统计</button>
        <button class="btn" id="topic-disable">停用</button>
        <span id="topic-msg" class="form-msg" style="margin:0"></span>
      </div>
      <div class="form-msg" id="topic-info" style="margin-top:10px;color:#999">启用后自动在 EMQX 上创建规则引擎（连接器 emqx-monitor-ingest + 规则），只统计该主题下的消息，其他主题不采集。</div>
    </div>
  </div>

  <div class="config-section">
    <div class="config-section-title">修改管理员密码</div>
    <div class="config-section-body">
      <div class="form-row">
        <label>旧密码</label>
        <input class="text-input" id="old-pw" type="password" autocomplete="current-password">
      </div>
      <div class="form-row">
        <label>新密码（至少 8 个字符）</label>
        <input class="text-input" id="new-pw" type="password" autocomplete="new-password">
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" id="change-pw">修改密码</button>
        <span id="pw-msg" class="form-msg" style="margin:0"></span>
      </div>
    </div>
  </div>

  <div class="config-section">
    <div class="config-section-title">运行信息</div>
    <div class="config-section-body">
      <div class="kv">监听端口：<b id="run-port"></b></div>
      <div class="kv">数据保留：<b id="run-retention"></b></div>
      <div class="kv">采集状态：<b id="run-status"></b></div>
      <div class="kv">在线客户端：<b id="run-clients"></b></div>
      <div class="kv" style="margin-top:8px;color:#999">采集精度：1 分钟。增量数据仅在客户端在线时记录，离线期间无流量数据。</div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
