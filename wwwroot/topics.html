<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主题统计 - FMO审计工具</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar">
  <span class="topbar-title">FMO审计工具</span>
  <nav class="topbar-nav">
    <a href="/">排行榜</a>
    <a href="/topics.html" class="active">主题统计</a>
    <a href="/online.html">在线</a>
    <a href="/audit.html">身份审计</a>
    <a href="/blacklist.html">黑名单</a>
    <a href="/health.html">健康</a>
    <a href="/settings.html">配置</a>
      <a href="/help.html">说明</a>
  </nav>
  <div class="topbar-right">
    <span id="collect-status"></span>
    <a id="logout">退出登录</a>
  </div>
</div>

<div class="filter-bar">
  <span class="filter-label">统计主题</span>
  <span id="topic-name" class="mono" style="font-weight:600;color:#000"></span>
  <span class="filter-label" style="margin-left:8px">时间范围</span>
  <button class="chip" data-range="today">今天</button>
  <button class="chip" data-range="yesterday">昨天</button>
  <button class="chip active" data-range="7d">近7天</button>
  <button class="chip" data-range="30d">近30天</button>
  <span class="filter-label" style="margin-left:8px">起始</span>
  <input type="datetime-local" id="from">
  <span class="filter-label">至</span>
  <input type="datetime-local" id="to">
  <span class="filter-label" style="margin-left:8px">排序</span>
  <button class="chip active" data-order="msg">消息数</button>
  <button class="chip" data-order="bytes">字节数</button>
  <button class="btn btn-small btn-primary" id="query">查询</button>
  <button class="btn btn-small" id="export">导出 CSV</button>
  <span class="filter-label" style="margin-left:12px">统计周期</span>
  <button class="chip" data-bucket="10s">10秒</button>
  <button class="chip" data-bucket="1m">1分钟</button>
  <button class="chip active" data-bucket="5m">5分钟</button>
  <button class="chip" data-bucket="1h">1小时</button>
  <label style="margin-left:12px;font-size:12px;color:#666;display:flex;align-items:center;gap:4px;cursor:pointer">
    <input type="checkbox" id="auto-refresh" checked> 自动刷新
  </label>
</div>

<div class="chart-box" style="padding-bottom:4px">
  <div class="chart-card">
    <div class="chart-title">全员发包时间轴（悬停查看该时间点详情）</div>
    <div class="chart-canvas-wrap" style="position:relative">
      <canvas id="timeline-canvas" style="height:200px"></canvas>
      <div id="timeline-tooltip" style="position:absolute;display:none;background:#fff;border:1px solid #333;padding:8px 10px;font-size:12px;line-height:1.6;pointer-events:none;z-index:10;min-width:170px"></div>
    </div>
  </div>
</div>

<div class="stats-bar">
  <span id="range-desc"></span>
  <span id="total-rows"></span>
  <span class="stat-spacer"></span>
  <span id="ingest-status"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:50px">排名</th>
        <th>呼号</th>
        <th class="num">设备数</th>
        <th class="num">消息数</th>
        <th class="num">字节数</th>
        <th style="width:70px">操作</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="hidden" style="padding:30px;text-align:center;color:#999;font-size:13px">该时间段内没有消息数据（确认已在配置页启用主题统计，且 EMQX 规则引擎在转发）</div>
</div>

<script src="/app.js"></script>
<div id="modal-root"></div>
</body>
</html>
