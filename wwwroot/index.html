<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排行榜 - FMO Audit Service</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <span class="topbar-title">FMO Audit Service</span>
  <nav class="topbar-nav">
    <a href="index.html" class="active">排行榜</a>
    <a href="topics.html">主题统计</a>
    <a href="online.html">在线</a>
    <a href="audit.html">身份审计</a>
    <a href="blacklist.html">黑名单</a>
    <a href="health.html">健康</a>
    <a href="settings.html">配置</a>
      <a href="help.html">说明</a>
  </nav>
  <div class="topbar-right">
    <span id="collect-status"></span>
    <a id="logout">退出登录</a>
  </div>
</div>

<div class="filter-bar">
  <span class="filter-label">时间范围</span>
  <button class="chip" data-range="today">今天</button>
  <button class="chip" data-range="yesterday">昨天</button>
  <button class="chip" data-range="7d">近7天</button>
  <button class="chip" data-range="30d">近30天</button>
  <button class="chip active" data-range="custom">自定义</button>
  <input type="datetime-local" id="from">
  <span class="filter-label">至</span>
  <input type="datetime-local" id="to">
  <span class="filter-label" style="margin-left:8px">排序</span>
  <button class="chip active" data-order="oct">字节量</button>
  <button class="chip" data-order="msg">消息数</button>
  <button class="chip" data-order="pkt">包数</button>
  <button class="btn btn-small btn-primary" id="query">查询</button>
  <button class="btn btn-small" id="export">导出 CSV</button>
  <label style="margin-left:12px;font-size:12px;color:#666;display:flex;align-items:center;gap:4px;cursor:pointer">
    <input type="checkbox" id="auto-refresh" checked> 自动刷新
  </label>
</div>

<div class="stats-bar">
  <span id="range-desc"></span>
  <span id="total-rows"></span>
  <span class="stat-spacer"></span>
  <span id="query-time"></span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:50px">排名</th>
        <th>呼号</th>
        <th class="num">设备数</th>
        <th class="num">总字节</th>
        <th class="num">总消息</th>
        <th class="num">总包数</th>
        <th class="num">重连次数</th>
        <th style="width:70px">操作</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="hidden" style="padding:30px;text-align:center;color:#999;font-size:13px">该时间段内没有客户端流量数据</div>
</div>

<script src="app.js"></script>
<div id="modal-root"></div>
</body>
</html>
