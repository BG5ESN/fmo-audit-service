# FMO Audit Service — docker compose 示例
# 用法:
#   1. bash script/build-all.sh 1.1.0   (或 PLATFORMS=linux-x64 ...)
#   2. cp dist/fmo-audit-service-linux-x64-v1.1.0 deploy/docker/fmo-audit-service
#   3. docker compose -f deploy/docker/docker-compose.yml up -d
services:
  fmo-audit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fmo-audit
    ports:
      - "9527:9527"
    volumes:
      # db + Data Protection 密钥都在这一个目录（容器 HOME=/data）
      - ./data:/data
    environment:
      # 反代场景（HTTPS 反代 + 覆盖 X-Forwarded-For）才启用：
      # - EMQX_MONITOR_TRUST_PROXY=1
      - TZ=Asia/Shanghai
    restart: unless-stopped
